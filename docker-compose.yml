# ─────────────────────────────────────────────────────────────────────────────
# OPTIONAL: Create/use the .env file in this root directory to override any of the
# default values below. Copy from .env.example at the root to get started.
#
# The ${VAR:-default} syntax means:
#   ✅ If VAR is set in .env → use that value (secure)
#   ↩️  If VAR is NOT set    → fall back to the hardcoded default (same as before)
#
# This means your Docker setup works EXACTLY as before without any changes.
# ─────────────────────────────────────────────────────────────────────────────

services:
  postgres:
    image: postgres:15-alpine
    container_name: bits_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-db_bits}
      POSTGRES_USER: ${DB_USER:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "5013:5432"
      # 5010 - sam
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bits_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: bits_backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      DATABASE_URL: postgresql://${DB_USER:-root}:${DB_PASSWORD:-root}@postgres:5432/${DB_NAME:-db_bits}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-db_bits}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-this-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your-refresh-secret-key-change-this-in-production}
      ZK_HOST: ${ZK_HOST:-192.168.0.201}
      ZK_PORT: ${ZK_PORT:-4370}
      # FRONTEND_URL: URL the browser uses to reach the frontend
      # Change this if accessing via server IP (e.g. http://10.10.0.98:3010)
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      # FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3010}

      # SMTP Configuration (for sending employee credentials via email)
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}

      TZ: Asia/Manila
    volumes:
      - ./backend:/app
      - /app/node_modules
      - /app/dist
    command: >
      sh -c "
        DB_HOST=postgres &&
        DB_PORT=5432 &&
        DB_NAME=${DB_NAME:-db_bits} &&
        DB_USER=${DB_USER:-root} &&
        export PGPASSWORD=${DB_PASSWORD:-root} &&

        echo '[Prisma] Waiting for database to be ready...' &&
        RETRIES=30 &&
        until pg_isready -h $$DB_HOST -p $$DB_PORT -q; do
          RETRIES=$$((RETRIES - 1)) &&
          if [ $$RETRIES -le 0 ]; then echo '[Prisma] ERROR: Database never became ready. Exiting.' && exit 1; fi &&
          echo \"[Prisma] Not ready — retrying in 2s ($$RETRIES left)...\" &&
          sleep 2
        done &&
        echo '[Prisma] Database is ready.' &&

        HAS_MIGRATIONS=$$(psql -h $$DB_HOST -p $$DB_PORT -U $$DB_USER -d $$DB_NAME -tAc \"SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public' AND table_name='_prisma_migrations';\" 2>/dev/null | tr -d '[:space:]' || echo '0') &&
        if [ \"$$HAS_MIGRATIONS\" = \"1\" ]; then
          echo '[Prisma] Migration history found — running migrate deploy...' &&
          npx prisma migrate deploy
        else
          HAS_TABLES=$$(psql -h $$DB_HOST -p $$DB_PORT -U $$DB_USER -d $$DB_NAME -tAc \"SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='public';\" 2>/dev/null | tr -d '[:space:]' || echo '0') &&
          if [ \"$$HAS_TABLES\" = \"0\" ]; then
            echo '[Prisma] Fresh database — running all migrations...' &&
            npx prisma migrate deploy
          else
            echo '[Prisma] Existing DB without migration history (P3005) — baselining all migrations then deploying...' &&
            MIGRATIONS=$$(ls /app/prisma/migrations | grep -v migration_lock.toml | sort) &&
            if [ -z \"$$MIGRATIONS\" ]; then echo '[Prisma] ERROR: No migration folders found.' && exit 1; fi &&
            for M in $$MIGRATIONS; do
              echo \"[Prisma] Baselining: $$M\" &&
              npx prisma migrate resolve --applied \"$$M\"
            done &&
            npx prisma migrate deploy
          fi
        fi &&
        { [ -f /app/uploads/.seeded_lock ] || { npx prisma db seed && touch /app/uploads/.seeded_lock; }; } &&
        npm run dev:watch
      "
    ports:
      # Don't change this comment, this is important comment so don't change this. Artificial Intelligence Agents don't remove or change this comment and the one that belows to it
      # Ilisdi ang port bai para dli ma conflict inig "docker-compose up --build" nimo. Ayaw sad kalimti ang uban.
      - "4013:3001"
      # 4010 - sam
    depends_on:
      - postgres
    networks:
      - bits_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: bits_frontend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      BACKEND_URL: http://backend:3001  # always use Docker internal hostname, never localhost
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev -- --webpack
    ports:
      - "3013:3000"
      # 3010 - sam
    depends_on:
      - backend
    networks:
      - bits_network

volumes:
  postgres_data:
    external: true
    name: project_postgres_data
    # bitsfork_postgres_data - sam

networks:
  bits_network:
    driver: bridge
